name: Bump & Release

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip the commit the bump itself creates; a push with nothing bumpable
    # (no feat/fix since the last tag) bumps nothing and releases nothing.
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # commitizen needs full history + tags to compute the bump
      - uses: astral-sh/setup-uv@v5
      # On the runner rather than in commitizen-action's container, which has no uv for the
      # pre_bump_hooks `uv lock` (pyproject.toml): the bump commit then carries a fresh uv.lock.
      - name: Bump version, update CHANGELOG.md and uv.lock, create tag
        id: cz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(uv run cz version --project)
          # --no-raise 3,21: no commits, or no feat/fix, since the last tag is not an error, just no release.
          uv run cz --no-raise 3,21 bump --yes
          after=$(uv run cz version --project)
          if [ "$after" != "$before" ]; then
            # From the changelog, not bump's stdout, which also carries the hook's and git's output.
            uv run cz changelog "$after" --dry-run > release-body.md
            git push origin HEAD:main "v$after"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        # Only set when a bump (and tag) was made.
        if: ${{ steps.cz.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.cz.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping."
          else
            gh release create "$tag" --title "$tag" --notes-file release-body.md
          fi
